[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "seevol"
version = "0.1.0"
authors = [
  { name="Archie Benn", email="sj19031@bristol.ac.uk" },
]
description = "All-pairs visibility analysis on voxel volumes (Amanatides & Woo, C++)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "pyvista"]

[project.urls]
Repository = "https://github.com/archiebenn/seeVol"

[tool.scikit-build]
wheel.packages = ["src/seevol"]
sdist.exclude = ["tests", "development_log.md", "uv-cheatsheet.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"  

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.linux]
